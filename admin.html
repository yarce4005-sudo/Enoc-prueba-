<script id="enoc-binance-rate">
/* Tasa de COMPRA USDT/VES de Binance P2P — fuente: usdt.com.ve (API pública, CC-BY-4.0).
   Endpoint documentado en https://www.usdt.com.ve/widget :
   GET https://www.usdt.com.ve/api/v1/rates/current → data.binance.buy_rate (Bs. por 1 USDT).
   Solo se lee binance.buy_rate; no se usan sell_rate, bybit, bcv ni promedios. Independiente de auth/Supabase. */
(function(){
  'use strict';
  var API_URL='https://www.usdt.com.ve/api/v1/rates/current';
  var REFRESH_MS=5*60*1000;   // actualización normal
  var RETRY_MS=60*1000;       // reintento tras un fallo
  var TIMEOUT_MS=12000;       // tiempo máximo por solicitud
  var STALE_MS=30*60*1000;    // aviso si la propia fuente no se actualiza

  var root=document.getElementById('enocRate');
  if(!root) return;
  var elValue=document.getElementById('enocRateValue');
  var elClock=document.getElementById('enocRateClock');
  var elPre=root.querySelector('.er-pre');
  var elFlag=document.getElementById('enocRateFlag');

  var rate=null, updatedAt=null, capturedAt=null;   // última tasa VÁLIDA
  var inFlight=false, timer=null, needsRefresh=false, lastError=null;

  function pad(n){return n<10?'0'+n:String(n)}
  function fmtTime(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
  function fmtRate(n){
    var p=n.toFixed(2).split('.');
    p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');
    return 'Bs. '+p[0]+','+p[1];
  }

  function parseResponse(json){
    if(!json||json.success===false||!json.data||!json.data.binance) throw new Error('Respuesta inesperada de la API');
    var raw=json.data.binance.buy_rate;
    var n=typeof raw==='number'?raw:(typeof raw==='string'&&raw.trim()!==''?Number(raw):NaN);
    if(!isFinite(n)||n<=0||n>1e7) throw new Error('buy_rate no válido');
    var c=json.data.captured_at?new Date(json.data.captured_at):null;
    if(c&&isNaN(c.getTime())) c=null;
    return {rate:n,captured:c};
  }

  function paint(state){
    var has=rate!==null;
    var isStale=has&&capturedAt&&(Date.now()-capturedAt.getTime()>STALE_MS);
    if(state==='idle') state=!has?'error':(lastError?'error':(isStale?'stale':'ok'));
    root.setAttribute('data-state',state);
    root.setAttribute('data-has',has?'1':'0');
    elValue.textContent=has?fmtRate(rate):'Bs. —';
    elFlag.hidden=state!=='error';

    var clock,pre=true,tip,aria;
    if(has){
      clock=fmtTime(updatedAt);
      tip='Tasa de COMPRA de USDT en Binance P2P (VES). Última actualización exitosa: '+clock+'.';
      if(capturedAt) tip+=' Dato capturado por la fuente: '+fmtTime(capturedAt)+'.';
      if(state==='error') tip+=' No se pudo actualizar; se conserva la última tasa válida.';
      else if(state==='stale') tip+=' Aviso: la fuente no ha publicado datos nuevos en más de 30 minutos.';
      tip+=' Se actualiza cada 5 minutos. Fuente: usdt.com.ve';
      aria='Binance P2P, tasa de compra '+fmtRate(rate)+', actualizada a las '+clock+(state==='error'?'. No se pudo actualizar.':'');
    }else if(state==='error'){
      clock='No disponible';pre=false;
      tip='No se pudo obtener la tasa de Binance P2P. Se reintentará automáticamente.';
      aria='Binance P2P, tasa no disponible';
    }else{
      clock='Cargando…';pre=false;
      tip='Cargando la tasa de compra de Binance P2P…';
      aria='Binance P2P, tasa de compra: cargando';
    }
    elClock.textContent=clock;
    elPre.hidden=!pre;
    root.title=tip;
    root.setAttribute('aria-label',aria);
  }

  function schedule(ms){
    clearTimeout(timer);
    timer=setTimeout(tick,ms);
  }

  function tick(){
    // Pestaña oculta: no consumir red; se refresca al volver.
    if(document.hidden){needsRefresh=true;schedule(REFRESH_MS);return}
    refresh();
  }

  function refresh(){
    if(inFlight) return;             // nunca dos solicitudes simultáneas
    inFlight=true;needsRefresh=false;
    clearTimeout(timer);
    paint(rate!==null?'refreshing':'loading');

    var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
    var abortTimer=setTimeout(function(){if(ctrl)ctrl.abort()},TIMEOUT_MS);
    var ok=false;

    fetch(API_URL,{method:'GET',cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:ctrl?ctrl.signal:undefined})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(parseResponse)
      .then(function(res){
        rate=res.rate;capturedAt=res.captured;updatedAt=new Date();lastError=null;ok=true;
      })
      .catch(function(err){
        lastError=err||new Error('Error desconocido');   // se conserva la última tasa válida
        if(window.console&&console.warn) console.warn('[ENOC] Tasa Binance P2P no actualizada:',lastError.message||lastError);
      })
      .then(function(){
        clearTimeout(abortTimer);
        inFlight=false;
        paint('idle');
        schedule(ok?REFRESH_MS:RETRY_MS);
      });
  }

  document.addEventListener('visibilitychange',function(){
    if(document.hidden) return;
    var age=updatedAt?Date.now()-updatedAt.getTime():Infinity;
    if(needsRefresh||age>=REFRESH_MS||(lastError&&!inFlight)) refresh();
  });
  window.addEventListener('online',function(){if(lastError) refresh()});

  paint('loading');
  refresh();
})();
</script>
